
<!DOCTYPE html>

    <meta charset="UTF-8" />

    <!-- Discourage HTTP caching of the HTML document so a fresh shell is always
         fetched and the live build is shown (helps escape stale old versions). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <meta property="og:title" content="Applegate CORE BOS" />
    <meta property="og:description" content="A versatile business operating system for desktop, enabling role-based access and management within organizations." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.jpg" />

    <!-- ═══════════════════════════════════════════════════════════════════════
         EARLY SERVICE-WORKER REFRESH BOOTSTRAP
         Runs BEFORE the app bundle. The moment this (fresh) HTML document is
         served, it forces every registered service worker to check for an
         updated /sw.js (bypassing the HTTP cache). This guarantees that any
         device which was previously stuck on an OLD service worker — and was
         therefore showing the old landing page — promptly detects and installs
         the new worker, which then purges stale caches and serves the live app.
         It is intentionally tiny, dependency-free, and fault-tolerant.
         ═══════════════════════════════════════════════════════════════════════ -->
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                // Force a fresh network check for an updated service worker.
                if (reg && typeof reg.update === 'function') {
                  reg.update().catch(function () {});
                }
              });
            }).catch(function () {});
          }
        } catch (e) { /* no-op: never block app boot */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
